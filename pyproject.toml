[project]
name = "travelops-ai"
version = "0.1.0"
description = "Multi-agent travel planning system"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.2",
    "langgraph>=0.1",
    "langchain-ollama>=0.1",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
